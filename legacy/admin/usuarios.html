<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | Panel administrador Florae</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar__logo">
                <img src="../img/logo.png" alt="Logo Florae" class="logo-img">
                <span>Florae</span>
            </div>

            <nav class="admin-nav">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="usuarios.html" aria-current="page">Usuarios</a></li>
                </ul>
            </nav>

            <div class="admin-sidebar__pie">
                <a href="../index.html">Volver a la tienda</a>
            </div>
        </aside>

        <main class="admin-contenido">
            <div class="admin-encabezado-lista">
                <h1>Usuarios</h1>
                <a href="nuevo-usuario.html" class="btn-principal">Nuevo usuario</a>
            </div>

            <div class="admin-tabla-contenedor">
                <table class="admin-tabla">
                    <thead>
                        <tr>
                            <th>RUN</th>
                            <th>Nombre completo</th>
                            <th>Correo</th>
                            <th>Tipo de usuario</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios-body">
                        <!-- Filas generadas dinámicamente por js/admin.js a partir del arreglo "usuariosAdmin" -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/productos.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
