<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="titulo-pagina">Nuevo usuario | Panel administrador Florae</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar__logo">
                <img src="../img/logo.png" alt="Logo Florae" class="logo-img">
                <span>Florae</span>
            </div>

            <nav class="admin-nav">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="usuarios.html" aria-current="page">Usuarios</a></li>
                </ul>
            </nav>

            <div class="admin-sidebar__pie">
                <a href="../index.html">Volver a la tienda</a>
            </div>
        </aside>

        <main class="admin-contenido">
            <h1 id="encabezado-formulario">Nuevo usuario</h1>

            <form id="form-usuario-admin" class="tarjeta-formulario" style="max-width: 560px; margin-top: 1.5rem;" novalidate>

                <div class="campo-formulario">
                    <label for="run">RUN</label>
                    <input type="text" id="run" name="run" placeholder="Sin puntos ni guión, ej: 19011022K" required minlength="7" maxlength="9">
                    <small class="mensaje-error" id="error-run"></small>
                </div>

                <div class="campo-formulario">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required maxlength="50">
                    <small class="mensaje-error" id="error-nombre"></small>
                </div>

                <div class="campo-formulario">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" required maxlength="100">
                    <small class="mensaje-error" id="error-apellidos"></small>
                </div>

                <div class="campo-formulario">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" required maxlength="100">
                    <small class="mensaje-error" id="error-correo">Solo se aceptan correos @duoc.cl, @profesor.duoc.cl o @gmail.com</small>
                </div>

                <div class="campo-formulario-doble">
                    <div class="campo-formulario">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" id="contrasena" name="contrasena" required minlength="4" maxlength="10">
                        <small class="mensaje-error" id="error-contrasena"></small>
                    </div>

                    <div class="campo-formulario">
                        <label for="tipo-usuario">Tipo de usuario</label>
                        <select id="tipo-usuario" name="tipo-usuario" required>
                            <option value="">-- Seleccione --</option>
                            <option value="Administrador">Administrador</option>
                            <option value="Vendedor">Vendedor</option>
                            <option value="Cliente">Cliente</option>
                        </select>
                        <small class="mensaje-error" id="error-tipo-usuario"></small>
                    </div>
                </div>

                <div class="campo-formulario">
                    <label for="fecha-nacimiento">Fecha de nacimiento (opcional)</label>
                    <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
                </div>

                <div class="campo-formulario-doble">
                    <div class="campo-formulario">
                        <label for="region">Región</label>
                        <select id="region" name="region" required>
                            <option value="">-- Seleccione la región --</option>
                        </select>
                    </div>

                    <div class="campo-formulario">
                        <label for="comuna">Comuna</label>
                        <select id="comuna" name="comuna" required>
                            <option value="">-- Seleccione la comuna --</option>
                        </select>
                    </div>
                </div>

                <div class="campo-formulario">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion" required maxlength="300">
                    <small class="mensaje-error" id="error-direccion"></small>
                </div>

                <button type="submit" class="btn-principal" id="btn-guardar-usuario">Guardar usuario</button>
            </form>
        </main>
    </div>

    <script src="../js/validaciones.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
